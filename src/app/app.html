<h1>To-Do-List</h1>

<div class="inp">
  <input type="text" [(ngModel)]="task" placeholder="Enter new task">
  <button type="button" (click)="addTask()">Add</button>
</div>


<div>
  <ul>
  @for(t of taskList;track t.id;let i=$index ){
  
    <li>{{i+1}}. {{t.task}} <button type="button" (click)="deleteTask(t.id)">Delete</button></li>
  
  }
  </ul>
</div>
